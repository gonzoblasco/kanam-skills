name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bash syntax checks
        run: |
          set -e
          for f in $(find skills -name '*.sh'); do
            bash -n "$f"
          done
          echo "All bash scripts OK"

      - name: Bash functional tests
        run: npx bats tests/bash/
